[workspace]
members = ["cargo:."]

# Config for 'dist'. Regenerate .github/workflows/release.yml with
# `dist init --yes` or `dist generate` after changing anything here.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Checksum algorithm published beside every archive
checksum = "sha256"
# Archive formats, kept as they were before dist was adopted
unix-archive = ".tar.gz"
windows-archive = ".zip"
# On a pull request, only run the planning job
pr-run-mode = "plan"
# The Homebrew tap the formula is pushed to
tap = "watt-mind/homebrew-tap"
# Formula name in the tap, so the command is `brew install watt-mind/tap/openszigno`
formula = "openszigno"
# Publish the Homebrew formula, the crates, and the container image after the
# artifacts are hosted. The two custom jobs run inside this workflow on
# purpose: dist undrafts the release with GITHUB_TOKEN, and a release event
# raised by GITHUB_TOKEN does not trigger any other workflow.
publish-jobs = ["homebrew", "./publish-crates", "./container"]
# Do not create the GitHub Release: a maintainer drafts it first and dist
# undrafts it once every job has succeeded. dist 0.32 has no option that
# leaves a release drafted at the end of a run.
create-release = false
# Smoke-test the built binary on a synthetic fixture before anything is
# published.
global-artifacts-jobs = ["./smoke-test"]
# Upload the assets and undraft the release in the `announce` phase instead of
# in `host`. `announce` runs after the Homebrew, crates.io, and container jobs,
# so the release only becomes public once every channel has published. With the
# default ("host") a failed publish left a public, partially distributed
# release.
github-release = "announce"

# The permissions the release workflow grants each custom publish job. A
# reusable workflow can only narrow the token it is called with, so the
# container job's `attestations: write` and both jobs' `contents: read` have
# to be granted here, at the caller.
[dist.github-custom-job-permissions]
publish-crates = { contents = "read" }
container = { contents = "read", packages = "write", "id-token" = "write", attestations = "write" }

# Third-party actions in the generated release.yml, pinned to full commit
# SHAs. dist emits `uses:` without a version comment, so the version each
# SHA corresponds to is recorded here:
#   actions/checkout          v6.1.0
#   actions/upload-artifact   v7.0.1
#   actions/download-artifact v8.0.1
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
