version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain to Cargo.toml's
      # rust-version on purpose; bump it together with rust-version.
      - dependency-name: dtolnay/rust-toolchain
