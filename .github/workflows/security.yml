name: Security

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  schedule:
    # Weekly scan from the default branch (scheduled workflows only run
    # from the default branch, which is develop here).
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

  codeql:
    name: CodeQL
    # CodeQL Rust coverage is unconfirmed for this repo; flip the
    # CODEQL_ENABLED repo variable to 'true' once verified.
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets --locked
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          ram: 8192
