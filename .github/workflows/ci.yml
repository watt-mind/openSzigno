name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          # A commit pin makes github.action_ref a SHA, so the toolchain
          # the action would otherwise read from the ref has to be given.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#target" "#refs" "#tmp" "#samples" "#node_modules"
      - name: Check relative links and anchors
        run: python3 scripts/check-doc-links.py
      - name: Source file length
        run: python3 scripts/check-file-length.py

  hygiene:
    name: Commit and PR hygiene
    # Only meaningful over a pull request's commit range and its body; a
    # push (to develop or master, after merge) has neither.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `origin/<base>..HEAD` resolves the whole
          # pull request range, not just the last commit.
          fetch-depth: 0
      - name: Check commit subjects in the pull request range
        run: |
          set -euo pipefail
          base="origin/${{ github.event.pull_request.base.ref }}"
          status=0
          for hash in $(git log --format=%H "$base"..HEAD); do
            # `git rev-list --parents -n1` prints "<hash> <parent>...";
            # more than one parent word means a merge commit. develop's
            # history has merge commits ("Merge pull request ...") this
            # rule was never meant to police, so they are skipped here
            # rather than required to look like a Conventional Commit.
            parents=$(git rev-list --parents -n 1 "$hash" | wc -w)
            if [ "$parents" -gt 2 ]; then
              continue
            fi
            author_email=$(git log -1 --format=%ae "$hash")
            case "$author_email" in
              *\[bot\]@users.noreply.github.com) continue ;;
            esac
            subject=$(git log -1 --format=%s "$hash")
            if ! printf '%s\n' "$subject" | ./scripts/commit-msg.sh -; then
              echo "::error::commit $hash: $subject"
              status=1
            fi
          done
          exit "$status"
      - name: Check the pull request body for a ticket reference
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          case "$AUTHOR" in
            dependabot\[bot\]|github-actions\[bot\])
              echo "bot-authored pull request ($AUTHOR); skipping the ticket-reference check"
              exit 0 ;;
          esac
          case ",$LABELS," in
            *,no-ticket,*)
              echo "'no-ticket' label present; skipping the ticket-reference check"
              exit 0 ;;
          esac
          if printf '%s\n' "$BODY" | grep -Eiq '^(Fixes|Closes|Refs) LAB-[0-9]+'; then
            exit 0
          fi
          echo "::error::pull request body must contain a line like 'Fixes LAB-123', 'Closes LAB-123', or 'Refs LAB-123' (or add the 'no-ticket' label)"
          exit 1

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - name: Smoke-test the release binary on synthetic fixtures
        shell: bash
        run: |
          cargo build --release --locked
          bin=target/release/openszigno
          for f in tests/fixtures/plain-base64.es3 tests/fixtures/zip-base64.es3; do
            "$bin" inspect "$f" --json >/dev/null
            "$bin" list "$f" --json >/dev/null
            "$bin" validate-structure "$f" --json >/dev/null
          done
          "$bin" extract tests/fixtures/plain-base64.es3 --output ci-out/plain --json
          "$bin" extract tests/fixtures/zip-base64.es3 --output ci-out/zip --json
          test "$(cat ci-out/plain/hello.txt)" = "Hello from openSzigno synthetic fixture."
          test "$(cat ci-out/zip/zipped.txt)" = "Zipped openSzigno synthetic fixture."

  golden:
    name: Golden output contract
    # The goldens under tests/golden/ are the machine-checked form of the
    # JSON envelope, the human renderer's lines, and the exit statuses. A
    # diff here is a change to what every consumer parses, so it fails the
    # pull request and is reviewed under the schema_version rule rather
    # than regenerated to make the build green.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the release binary
        run: cargo build --release --locked -p openszigno-cli
      - name: Check the golden output contract
        run: python3 scripts/golden.py check --bin target/release/openszigno

  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88 branch @ 2026-09-03
        with:
          # Keep this equal to `rust-version` in the workspace Cargo.toml.
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked

  semver:
    name: Semver checks
    # Compares the crate on this branch against the version already
    # published on crates.io. `cargo-semver-checks` reads the current
    # `Cargo.toml` version to decide the allowed change kind, so a real
    # minor/major bump on a pull request raises the bar it checks against
    # instead of failing on the bump itself. See
    # docs/releasing.md#semver-checks for how this applies to the 0.x
    # crates here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: stable
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          # A commit pin makes github.action_ref a SHA, so the tool the
          # action would otherwise read from the ref has to be given.
          tool: cargo-semver-checks@0.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check openszigno-core against the published API
        run: cargo semver-checks -p openszigno-core
      - name: Check openszigno-verify against the published API (advisory)
        # openszigno-verify on develop already carries breaking API changes
        # relative to the published 0.4.0 (new pub fields on
        # SignatureCoverage/ChainEntry, a new RevocationPolicy variant, and
        # a renamed SignatureCoverage field), with no version bump yet to
        # authorize them. That is a version decision for the next release,
        # not something this job should block on; see
        # docs/releasing.md#semver-checks. Flip this step blocking (drop
        # `continue-on-error`) once the version is bumped to cover them.
        continue-on-error: true
        run: cargo semver-checks -p openszigno-verify

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Posting or refreshing the PR coverage comment needs to create issue
    # comments on the pull request; everything else in this job only
    # needs the default read access, so the elevated permissions are
    # scoped to this job rather than the workflow.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, and all branches (not just the checked-out
          # ref), so `git merge-base` can find the base commit the
          # patch-coverage gate diffs against.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          # A commit pin makes github.action_ref a SHA, so the tool the
          # action would otherwise read from the ref has to be given.
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Measure line coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Report the coverage summary
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Determine the patch-coverage base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base "origin/${{ github.base_ref || 'develop' }}" HEAD)
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Run the coverage quality gate
        id: gate
        run: |
          set +e
          python3 scripts/coverage_gate.py \
            --lcov lcov.info \
            --base "${{ steps.base.outputs.base }}" \
            | tee coverage-gate-summary.md
          status="${PIPESTATUS[0]}"
          echo "status=$status" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Post or refresh the coverage PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- coverage-gate -->'
          repo="${{ github.repository }}"
          pr_number="${{ github.event.pull_request.number }}"
          body_file="$(mktemp)"
          { echo "$marker"; echo; cat coverage-gate-summary.md; } > "$body_file"

          existing=$(gh api "repos/$repo/issues/$pr_number/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][-1].id // empty")
          if [ -n "$existing" ]; then
            gh api "repos/$repo/issues/comments/$existing" -X PATCH -f body=@"$body_file"
          else
            gh api "repos/$repo/issues/$pr_number/comments" -X POST -f body=@"$body_file"
          fi
      - name: Enforce the coverage quality gate
        run: |
          if [ "${{ steps.gate.outputs.status }}" != "0" ]; then
            echo "::error::scripts/coverage_gate.py reported a coverage-gate failure; see the job summary or the PR comment"
            exit 1
          fi
      - name: Coverage floor backstop
        # scripts/coverage_gate.py is the primary, finer-grained gate
        # (per-crate floor, ratchet, patch coverage); this workspace-wide
        # 85% floor stays as a coarse last-resort backstop in case the
        # script itself has a bug that makes it pass when it should not.
        run: cargo llvm-cov report --fail-under-lines 85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          retention-days: 1
          path: |
            lcov.info
            coverage-summary.txt
            coverage-gate-summary.md

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  package:
    name: Package the crates
    # `cargo publish` builds a .crate from each manifest and rejects a
    # manifest that a registry cannot accept. Doing it here means a broken
    # manifest fails on the pull request instead of halfway through a
    # release, after `openszigno-core` has already been published.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--no-verify` skips the build of the packaged crate. It is required
      # here, not a shortcut: `openszigno-verify` and `openszigno-cli`
      # depend on workspace crates whose released version is not on
      # crates.io until the release itself publishes it, so a verifying
      # package run cannot resolve them. What is still checked is every
      # manifest field a registry validates and the exact file list that
      # would be uploaded.
      - name: Package openszigno-core
        run: cargo package -p openszigno-core --no-verify --locked
      # The dependent crates pin openszigno-core at the workspace version.
      # Packaging them resolves that dependency against crates.io, which
      # cannot succeed on a version-bump pull request until the release
      # publishes core. Package them when the version exists, skip with a
      # notice otherwise; the release workflow publishes in order.
      - name: Package the dependent crates
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "openszigno-core") | .version')
          if curl -sSf "https://index.crates.io/op/en/openszigno-core" \
              | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            cargo package -p openszigno-verify --no-verify --locked
            cargo package -p openszigno-cli --no-verify --locked
          else
            echo "::notice::openszigno-core $version is not on crates.io yet; skipping the dependent crates until the release publishes it"
          fi
      - name: List the packaged files
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in target/package/*.crate; do
            echo "== $(basename "$archive")"
            tar -tzf "$archive" | sort
          done

  container:
    name: Container image
    # Builds the release Dockerfile the way container.yml does, for
    # linux/amd64 only, and runs the shipped CLI inside the scratch image
    # against the synthetic fixtures. A Dockerfile that no longer builds,
    # or an image whose binary cannot read a dossier, fails on the pull
    # request rather than during a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the image for linux/amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: openszigno:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Run the CLI inside the image against the fixtures
        run: |
          set -euo pipefail
          mkdir -p container-out
          # The image is `scratch` with no shell, so every command is a
          # separate `docker run` with the entrypoint's arguments. The
          # fixtures are mounted read-only; only the output directory is
          # writable, and it is owned by the image's numeric UID.
          sudo chown 65532:65532 container-out
          run() {
            docker run --rm \
              -v "$PWD/tests/fixtures:/work/fixtures:ro" \
              -v "$PWD/container-out:/work/out" \
              openszigno:ci "$@"
          }

          run --version
          for f in plain-base64 zip-base64; do
            run inspect "fixtures/${f}.es3" --json > "container-${f}-inspect.json"
            test "$(jq -r .ok "container-${f}-inspect.json")" = "true"
            test "$(jq -r .input.format "container-${f}-inspect.json")" = "microsec-es3"
            run list "fixtures/${f}.es3" --json > /dev/null
            run validate-structure "fixtures/${f}.es3" --json > /dev/null
          done

          run extract fixtures/plain-base64.es3 --output out/plain --json
          run extract fixtures/zip-base64.es3 --output out/zip --json
          # `extract` creates its output directory as 0700 owned by the
          # container's UID, which is the point, so the bytes are read back
          # as root rather than by relaxing the directory.
          test "$(sudo cat container-out/plain/hello.txt)" = "Hello from openSzigno synthetic fixture."
          test "$(sudo cat container-out/zip/zipped.txt)" = "Zipped openSzigno synthetic fixture."

          # An unsigned dossier can never be reported valid, so `verify`
          # exits 7 (indeterminate). Anything else, 0 included, is a bug.
          status=0
          run verify fixtures/plain-base64.es3 --json > container-verify.json || status=$?
          test "$status" = "7"
          test "$(jq -r .data.verdict container-verify.json)" = "indeterminate"
