name: Publish crates

# Custom `dist` publish job, wired in as `./publish-crates` in the
# `publish-jobs` list of dist-workspace.toml. It runs inside the release
# workflow, after `host` has uploaded the artefacts and before `announce`
# undrafts the release.
#
# It deliberately does not trigger on `release: published`: dist undrafts
# the release with GITHUB_TOKEN, and an event raised by GITHUB_TOKEN never
# triggers another workflow, so a release-event workflow would never fire.
#
# `workflow_dispatch` stays for reruns by hand after a failed publish.

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan, as a JSON string. Passed by release.yml.
        required: false
        type: string
        default: ""
      tag:
        description: Release tag to publish, e.g. v0.2.0. Overrides the plan.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.2.0.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Resolve the release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PLAN: ${{ inputs.plan }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ -n "$PLAN" ]; then
            tag=$(printf '%s' "$PLAN" | jq -r '.announcement_tag // empty')
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release tag: pass a tag input, or a plan carrying announcement_tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches the workspace version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "openszigno-cli") | .version')
          echo "workspace version: $version"
          echo "release tag:       $TAG"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi

      - name: Check for the registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish. Set the secret to enable it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Published in dependency order. `cargo publish` waits for each crate
      # to appear in the index before it returns, so the next one resolves.
      - name: Publish openszigno-core
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p openszigno-core --locked

      - name: Publish openszigno-verify
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p openszigno-verify --locked

      - name: Publish openszigno-cli
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p openszigno-cli --locked
