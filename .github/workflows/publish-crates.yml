name: Publish crates

# Publishes openszigno-core and openszigno-cli to crates.io once a release
# is published. The crates are published in dependency order; cargo waits
# for openszigno-core to appear in the index before openszigno-cli, which
# depends on it by path and version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches the workspace version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "openszigno-cli") | .version')
          echo "workspace version: $version"
          echo "release tag:       $TAG"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi

      - name: Check for the registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish. Set the secret to enable it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish openszigno-core
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p openszigno-core --locked

      - name: Publish openszigno-cli
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p openszigno-cli --locked
