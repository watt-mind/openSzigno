name: Fuzzing

# Nightly, not required on pull requests: cargo-fuzz needs the nightly
# toolchain and libFuzzer/AddressSanitizer instrumentation this project's
# stable MSRV build never uses (see docs/testing.md#fuzzing and fuzz/'s own
# `[workspace] exclude` in the root Cargo.toml), and a useful run per target
# takes minutes, not seconds. This workflow tracks "no target ever panics"
# the way mutants.yml (LAB-267) tracks a caught-mutant floor: on its own
# nightly schedule, plus manual dispatch, with a failure opening or
# refreshing a tracking issue instead of blocking a merge.

on:
  schedule:
    # 03:30 UTC nightly: after the mutation-testing run's own 03:00 cron
    # (see mutants.yml) so the two nightly jobs do not contend for runners.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Fuzz target to run
        type: choice
        options:
          - all
          - parse_dossier
          - sniff
          - decode_payload
          - decrypt_cms
          - c14n
          - crl_parse
          - ocsp_parse
          - tsa_token
          - trustlist_parse
          - certificate_parse
        default: all
      seconds:
        description: Seconds to fuzz each target (-max_total_time)
        type: string
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Choose the target matrix
        id: plan
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -euo pipefail
          all='["parse_dossier","sniff","decode_payload","decrypt_cms","extract_plan","destination_url","c14n","crl_parse","ocsp_parse","tsa_token","trustlist_parse","certificate_parse"]'
          if [ "$TARGET" = "all" ]; then
            echo "targets=$all" >> "$GITHUB_OUTPUT"
          else
            printf 'targets=["%s"]\n' "$TARGET" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    runs-on: ubuntu-latest
    # One target's build-and-run budget. `-max_total_time` below is bounded
    # to leave headroom for checkout, the nightly toolchain, and the
    # cargo-fuzz build itself inside this same window.
    timeout-minutes: 20
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Run cargo fuzz
        id: run
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '600' }}
        run: |
          set +e
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time="$FUZZ_SECONDS" -jobs=1
          echo "status=$?" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.run.outputs.status != '0'
        with:
          name: fuzz-crash-${{ matrix.target }}
          retention-days: 90
          path: |
            fuzz/artifacts/${{ matrix.target }}
      - name: Fail the job on a crash
        if: steps.run.outputs.status != '0'
        run: |
          echo "::error::cargo fuzz run ${{ matrix.target }} exited with status ${{ steps.run.outputs.status }}; see the uploaded artifact"
          exit 1

  report:
    name: Report crashes
    needs: [fuzz]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job in this workflow that writes anything: scoped to this job
    # alone so every fuzzing job above stays read-only.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-crash-*
          path: artifacts
          merge-multiple: false
      - name: Build the tracking-issue body
        run: |
          set -euo pipefail
          marker='<!-- fuzz-crashes -->'
          {
            echo "$marker"
            echo
            echo "Nightly fuzzing found a crash. A crash is a bug in the crate"
            echo "under test (docs/testing.md#fuzzing): reproduce with"
            echo '`cargo +nightly fuzz run <target> <artifact>`, minimise with'
            echo '`cargo +nightly fuzz tmin`, and commit the minimised input'
            echo "under \`fuzz/artifacts/<target>/\` alongside the fix."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Crashing targets (see the run's uploaded artifacts for the inputs):"
            for dir in artifacts/fuzz-crash-*; do
              [ -d "$dir" ] || continue
              echo "- ${dir#artifacts/fuzz-crash-}"
            done
          } > issue-body.md
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- fuzz-crashes -->'
          title='Fuzzing: crashes'
          repo="${{ github.repository }}"

          existing=$(gh api "repos/$repo/issues" -X GET -f state=open --paginate \
            --jq "[.[] | select(.title == \"$title\") | select(.body | startswith(\"$marker\"))][0].number // empty")
          if [ -n "$existing" ]; then
            gh api "repos/$repo/issues/$existing" -X PATCH -f body=@issue-body.md
          else
            gh api "repos/$repo/issues" -X POST -f title="$title" -f body=@issue-body.md
          fi
