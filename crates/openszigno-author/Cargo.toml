[package]
name = "openszigno-author"
description = "Deterministic writer for Microsec e-Szigno dossiers, bounded by the openszigno-core limits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage = "https://github.com/watt-mind/openSzigno"
documentation = "https://docs.rs/openszigno-author"
keywords = ["e-szigno", "es3", "dossier", "xml", "microsec"]
categories = ["parser-implementations", "encoding"]

[lints]
workspace = true

[dependencies]
# AES-256-CBC content encryption for the `encrypt` transform. No other
# content cipher is ever written; DES-EDE3-CBC is read by `openszigno-core`
# for compatibility and is never produced here.
aes.workspace = true
base64.workspace = true
cbc.workspace = true
cipher.workspace = true
cms.workspace = true
der.workspace = true
openszigno-core = { version = "0.6.0", path = "../openszigno-core" }
pem-rfc7468.workspace = true
# `OsRng`: the content-encryption key, the initialisation vector, and the
# key-transport padding must all be unpredictable.
rand_core.workspace = true
rsa.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
x509-cert.workspace = true
# The content-encryption key is zeroed when it is dropped.
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
rand_chacha.workspace = true
rand_core.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
serde_json.workspace = true
