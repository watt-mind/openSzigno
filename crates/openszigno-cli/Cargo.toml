[package]
name = "openszigno-cli"
description = "Agent-friendly CLI for inspecting and extracting Microsec e-Szigno dossiers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage = "https://github.com/watt-mind/openSzigno"
documentation = "https://github.com/watt-mind/openSzigno#readme"
keywords = ["e-szigno", "es3", "dossier", "cli", "microsec"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "openszigno"
path = "src/main.rs"

[dependencies]
clap.workspace = true
openszigno-core = { version = "0.1.0", path = "../openszigno-core" }
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Archive layout produced by the release workflow, so that
# `cargo binstall openszigno-cli` finds the prebuilt binaries:
#   openszigno-v0.1.0-x86_64-unknown-linux-musl.tar.gz
#     openszigno-v0.1.0-x86_64-unknown-linux-musl/openszigno
# The binary name is spelled out in `pkg-url` because `{ bin }` is only
# bound in `bin-dir` templates, not in the package URL context.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/openszigno-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
