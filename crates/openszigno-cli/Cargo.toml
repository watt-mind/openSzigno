[package]
name = "openszigno-cli"
description = "Agent-friendly CLI for inspecting and extracting Microsec e-Szigno dossiers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage = "https://github.com/watt-mind/openSzigno"
documentation = "https://github.com/watt-mind/openSzigno#readme"
keywords = ["e-szigno", "es3", "dossier", "cli", "microsec"]
categories = ["command-line-utilities", "parser-implementations"]

[lints]
workspace = true

[[bin]]
name = "openszigno"
path = "src/main.rs"

[dependencies]
clap.workspace = true
openszigno-core = { version = "0.5.1", path = "../openszigno-core" }
openszigno-verify = { version = "0.5.1", path = "../openszigno-verify" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
ureq.workspace = true
# Key and passphrase buffers zero themselves when dropped.
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The end-to-end tests need a dossier that actually verifies, so they reuse the
# synthetic PKI and XMLDSig signer under `crates/openszigno-verify/tests/common`
# rather than keeping a second copy. Signing is a permanent non-goal of the
# shipped tool; none of this reaches a shipped crate.
aes.workspace = true
base64.workspace = true
cbc.workspace = true
cipher.workspace = true
cms = "0.2"
const-oid.workspace = true
der.workspace = true
des.workspace = true
p256.workspace = true
p384.workspace = true
pkcs8.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
rsa.workspace = true
sha1.workspace = true
tempfile.workspace = true
x509-cert.workspace = true
x509-ocsp = "0.2.1"

# Archive layout produced by the dist release workflow, so that
# `cargo binstall openszigno-cli` finds the prebuilt binaries:
#   openszigno-cli-x86_64-unknown-linux-musl.tar.gz
#     openszigno-cli-x86_64-unknown-linux-musl/openszigno
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
