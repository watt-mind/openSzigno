[package]
name = "openszigno-core"
description = "Safe structural parsing and extraction primitives for Microsec e-Szigno dossiers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage = "https://github.com/watt-mind/openSzigno"
documentation = "https://docs.rs/openszigno-core"
keywords = ["e-szigno", "es3", "dossier", "xml", "microsec"]
categories = ["parser-implementations", "encoding"]

[lints]
workspace = true

[dependencies]
aes.workspace = true
base64.workspace = true
cbc.workspace = true
cipher.workspace = true
cms.workspace = true
const-oid.workspace = true
der.workspace = true
# Triple DES is reachable only through `DecryptOptions::allow_legacy_ciphers`.
des.workspace = true
encoding_rs.workspace = true
# Derives the synthetic content-encryption key that PKCS#1 v1.5 implicit
# rejection substitutes for an unusable padding block.
hmac.workspace = true
pem-rfc7468.workspace = true
pkcs8.workspace = true
# `OsRng`, to blind the RSA key-transport decryption in `decrypt/cms.rs`
# against timing side-channels on the private exponentiation (see
# `deny.toml` and `SECURITY.md` for what this does and does not mitigate).
rand_core = { workspace = true }
roxmltree.workspace = true
rsa.workspace = true
serde.workspace = true
# SHA-1 exists only for RSAES-OAEP's default mask generation, which older
# senders use; it is never used as a signature or integrity digest here.
sha1.workspace = true
sha2.workspace = true
# Constant-time selection and comparison in `decrypt/keytrans.rs`.
subtle.workspace = true
thiserror.workspace = true
x509-cert = { workspace = true, features = ["pem"] }
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
rand_chacha.workspace = true
rand_core.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
serde_json.workspace = true
tempfile.workspace = true
