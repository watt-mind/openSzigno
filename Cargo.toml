[workspace]
members = ["crates/openszigno-core", "crates/openszigno-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Watt-Mind/openSzigno"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.5.48", features = ["derive"] }
encoding_rs = "0.8.40"
roxmltree = "0.21.1"
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
unicode-normalization = "0.1"
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }
