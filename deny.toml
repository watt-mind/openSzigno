  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # `webpki-roots`, which `ureq`'s rustls stack uses for the TLS trust anchors
